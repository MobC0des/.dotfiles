theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
mouse = true
cursorline = true
true-color = true
bufferline = "multiple"
auto-format = true
completion-trigger-len = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1
